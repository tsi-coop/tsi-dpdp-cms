<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1265" width="2000" height="1265"><defs><marker id="m_1d4ed8" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#1d4ed8"/></marker><marker id="m_0f766e" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#0f766e"/></marker><marker id="m_4338ca" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#4338ca"/></marker><marker id="m_dc2626" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#dc2626"/></marker><marker id="m_0369a1" markerWidth="5" markerHeight="5" refX="3.2" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 z" fill="#0369a1"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="1000.0" y="80" font-size="54" font-weight="800" fill="#0f172a" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Voice Helpline Integration Architecture: TSI DPDP CMS</text><text x="1000.0" y="132" font-size="30" font-weight="600" fill="#334155" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">The telephony switch (IVR) and the agent CRM are both synchronized API clients</text><rect x="10" y="175" width="600" height="800" rx="28" fill="#e0f2fe" stroke="#0369a1" stroke-width="5" stroke-dasharray="22 12"/><text x="310.0" y="237" font-size="38" font-weight="800" fill="#0369a1" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">TELEPHONY &amp; IVR</text><rect x="700" y="175" width="600" height="800" rx="28" fill="#d6f5ec" stroke="#0f766e" stroke-width="5" stroke-dasharray="22 12"/><text x="1000.0" y="237" font-size="38" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">TSI DPDP CMS ENGINE</text><rect x="1390" y="175" width="600" height="800" rx="28" fill="#ebe9ff" stroke="#4338ca" stroke-width="5" stroke-dasharray="22 12"/><text x="1690.0" y="237" font-size="38" font-weight="800" fill="#4338ca" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">HELPLINE CRM / MIS</text><rect x="50" y="270" width="520" height="200" rx="18" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/><text x="310.0" y="365.0" font-size="32" font-weight="800" fill="#0369a1" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Inbound Phone Call</text><text x="310.0" y="419.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Voice caller</text><rect x="50" y="500" width="520" height="230" rx="18" fill="#ffffff" stroke="#0369a1" stroke-width="6"/><text x="310.0" y="576.0" font-size="32" font-weight="800" fill="#0369a1" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Voice Telephony Gateway</text><text x="310.0" y="630.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Plays the audio notice</text><text x="310.0" y="664.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Captures DTMF (1 = Yes)</text><text x="310.0" y="698.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">or a short voice reply</text><rect x="50" y="760" width="520" height="190" rx="18" fill="#ffffff" stroke="#38bdf8" stroke-width="4"/><text x="310.0" y="850.0" font-size="32" font-weight="800" fill="#0369a1" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">SMS / WhatsApp</text><text x="310.0" y="904.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Sends the full notice link</text><rect x="740" y="270" width="520" height="200" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="6"/><text x="1000.0" y="348.0" font-size="32" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">REST API Gateway</text><text x="1000.0" y="402.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">/policy, /consent</text><text x="1000.0" y="436.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">validate_consent</text><rect x="740" y="500" width="520" height="230" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/><text x="1000.0" y="576.0" font-size="32" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Policy Engine &amp; Scope</text><text x="1000.0" y="630.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Evaluates the call purpose</text><text x="1000.0" y="664.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Keys records to hashed phone ID</text><text x="1000.0" y="698.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Handles withdrawal</text><rect x="740" y="760" width="520" height="190" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="4"/><text x="1000.0" y="833.0" font-size="32" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Audit Ledger</text><text x="1000.0" y="887.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Time-stamped consent and</text><text x="1000.0" y="921.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">withdrawal events</text><rect x="1430" y="270" width="520" height="200" rx="18" fill="#ffffff" stroke="#818cf8" stroke-width="4"/><text x="1690.0" y="348.0" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">CRM Call Router</text><text x="1690.0" y="402.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Calls validate_consent</text><text x="1690.0" y="436.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">before routing the call</text><rect x="1430" y="500" width="520" height="230" rx="18" fill="#ffffff" stroke="#4338ca" stroke-width="6"/><text x="1690.0" y="576.0" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Agent Call Workspace</text><text x="1690.0" y="630.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Unlocks caller records on consent</text><text x="1690.0" y="664.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Shows consent status</text><text x="1690.0" y="698.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Triggers manual withdrawal</text><rect x="1430" y="760" width="520" height="190" rx="18" fill="#ffffff" stroke="#818cf8" stroke-width="4"/><text x="1690.0" y="833.0" font-size="32" font-weight="800" fill="#4338ca" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Data Redaction Worker</text><text x="1690.0" y="887.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Executes purge events</text><text x="1690.0" y="921.0" font-size="26" font-weight="600" fill="#1e293b" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">in CRM and MIS</text><line x1="570" y1="370" x2="740" y2="370" stroke="#0369a1" stroke-width="7" marker-end="url(#m_0369a1)"/><circle cx="655.0" cy="370" r="27" fill="#0369a1" stroke="#ffffff" stroke-width="4"/><text x="655.0" y="381" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">1</text><line x1="570" y1="615" x2="740" y2="615" stroke="#0369a1" stroke-width="7" marker-end="url(#m_0369a1)"/><circle cx="655.0" cy="615" r="27" fill="#0369a1" stroke="#ffffff" stroke-width="4"/><text x="655.0" y="626" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">2</text><line x1="1430" y1="370" x2="1260" y2="370" stroke="#4338ca" stroke-width="7" marker-end="url(#m_4338ca)"/><circle cx="1345.0" cy="370" r="27" fill="#4338ca" stroke="#ffffff" stroke-width="4"/><text x="1345.0" y="381" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">3</text><line x1="1260" y1="855" x2="1430" y2="855" stroke="#dc2626" stroke-width="7" stroke-dasharray="16 10" marker-end="url(#m_dc2626)"/><circle cx="1345.0" cy="855" r="27" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="1345.0" y="866" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">4</text><rect x="20" y="1005" width="1960" height="230" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/><circle cx="70" cy="1050" r="27" fill="#0369a1" stroke="#ffffff" stroke-width="4"/><text x="70" y="1061" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">1</text><text x="120" y="1060" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">IVR fetches the active notice (/policy) and plays it to the caller</text><circle cx="70" cy="1100" r="27" fill="#0369a1" stroke="#ffffff" stroke-width="4"/><text x="70" y="1111" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">2</text><text x="120" y="1110" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">Caller presses 1 or speaks; IVR records the outcome (/consent), keyed to the hashed phone number</text><circle cx="70" cy="1150" r="27" fill="#4338ca" stroke="#ffffff" stroke-width="4"/><text x="70" y="1161" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">3</text><text x="120" y="1160" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">CRM calls validate_consent before routing the call and unlocking records for the agent</text><circle cx="70" cy="1200" r="27" fill="#dc2626" stroke="#ffffff" stroke-width="4"/><text x="70" y="1211" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">4</text><text x="120" y="1210" font-size="28" font-weight="700" fill="#0f172a" text-anchor="start" font-family="'Liberation Sans','DejaVu Sans',Arial,sans-serif">On withdrawal, the CMS fires a purge webhook and the redaction worker cleans CRM and MIS</text></svg>